name: Docs

# Builds the documentation site (docs/Stil.Docs.Host, which renders the pages of docs/Stil.Docs on
# the server and then runs them with WebAssembly) on every push and pull request, and deploys it
# to GitHub Pages from main as static files: https://dradwul.github.io/Stil/
#
# One-time setup (owner): Settings > Pages > Build and deployment > Source: GitHub Actions.
# Until then the deploy job fails with a message that Pages is not enabled; the build still
# checks the site. GitHub Pages is free for public repositories.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the docs site
        run: dotnet publish docs/Stil.Docs.Host --configuration Release --output site

      # Pages has no server, so the site runs here once: tools/export-docs.mjs saves every page in
      # its sitemap as <path>.html (Pages serves /Stil/components/buttons from it, with status 200),
      # a real 404.html, sitemap.xml and robots.txt, with the public address and base path, and the
      # files the server only answers as endpoints. The pages then start WebAssembly as usual. For AI
      # assistants it also writes every page as Markdown, llms.txt and llms-full.txt.
      - name: Export the site as static files
        run: node tools/export-docs.mjs site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
