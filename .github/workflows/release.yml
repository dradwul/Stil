name: Release

# Publishes Stil, Stil.Charts, Stil.Markdown, Stil.RichText and Stil.Templates to nuget.org when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The version comes from the tag (v1.2.3 or v1.2.3-preview.1). Nothing else publishes: pushes to
# main and pull requests only build and test (ci.yml).
#
# Setup on nuget.org: a trusted publishing policy for this repository and this workflow file
# (environment "nuget"), and the repository variable NUGET_USER with the nuget.org user name.
# No API key is stored in GitHub.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings > Environments) to approve each release.
    environment: nuget
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing to nuget.org

    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version such as v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      # The release notes are the version's section in CHANGELOG.md, so every release has one.
      - name: Read the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]'. Move the Unreleased notes there first."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Stil.Css/package-lock.json

      - name: Check that dist/ matches the sources
        working-directory: src/Stil.Css
        run: |
          npm ci
          npm run check

      # Apps made with dotnet new stil-app reference the Stil version they were released with.
      - name: Set the template's default Stil version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "templates/Stil.Templates/content/StilApp/.template.config/template.json";
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.symbols.StilVersion.defaultValue = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          '

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet restore Stil.sln
          dotnet build Stil.sln --configuration Release --no-restore -p:Version="$VERSION"
          dotnet test Stil.sln --configuration Release --no-build --logger GitHubActions

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for project in src/Stil.Blazor src/Stil.Charts src/Stil.Markdown src/Stil.RichText templates/Stil.Templates; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts -p:Version="$VERSION"
          done

      - name: Verify the package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          unzip -l "artifacts/Stil.$VERSION.nupkg" | tee stil.txt
          grep -q 'staticwebassets/stil.css' stil.txt
          grep -q 'build/Stil.targets' stil.txt
          grep -q 'README.md' stil.txt
          unzip -l "artifacts/Stil.Charts.$VERSION.nupkg" | tee charts.txt
          grep -q 'staticwebassets/stil-charts.css' charts.txt
          unzip -l "artifacts/Stil.Markdown.$VERSION.nupkg" | tee markdown.txt
          grep -q 'Stil.Markdown.xml' markdown.txt
          unzip -l "artifacts/Stil.RichText.$VERSION.nupkg" | tee richtext.txt
          grep -q 'Stil.RichText.xml' richtext.txt
          unzip -l "artifacts/Stil.Templates.$VERSION.nupkg" | tee templates.txt
          grep -q 'content/StilApp/.template.config/template.json' templates.txt
          template=$(unzip -Z1 "artifacts/Stil.Templates.$VERSION.nupkg" | grep 'StilApp/.template.config/template.json$')
          unzip -p "artifacts/Stil.Templates.$VERSION.nupkg" "$template" | grep -q "\"defaultValue\": \"$VERSION\""

      - name: Log in to nuget.org (trusted publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The symbol packages (.snupkg) next to the packages are pushed with them.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          # The release also carries the CSS files, for plain HTML without npm (npm.yml publishes stil-css).
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            src/Stil.Css/dist/stil.css src/Stil.Css/dist/stil.min.css src/Stil.Css/dist/stil.js \
            --title "Stil $VERSION" --notes-file release-notes.md "${flags[@]}"
