name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Stil.Css/package-lock.json

      - name: Install CSS build tools
        working-directory: src/Stil.Css
        run: npm ci

      - name: Check that dist/ matches the sources, the contrast and the size budget
        working-directory: src/Stil.Css
        run: npm run check

      - name: Restore
        run: dotnet restore Stil.sln

      # Builds the libraries, the demo, the docs site, the template package and the tests.
      - name: Build
        run: dotnet build Stil.sln --configuration Release --no-restore

      - name: Test
        # The GitHubActions logger shows each failed test as an annotation on the run.
        run: dotnet test Stil.sln --configuration Release --no-build --logger GitHubActions

      # The packages are built and checked here; release.yml publishes them from a version tag.
      - name: Pack
        run: |
          dotnet pack src/Stil.Blazor --configuration Release --no-build --output artifacts
          dotnet pack src/Stil.Charts --configuration Release --no-build --output artifacts
          dotnet pack src/Stil.Markdown --configuration Release --no-build --output artifacts
          dotnet pack src/Stil.RichText --configuration Release --no-build --output artifacts
          dotnet pack templates/Stil.Templates --configuration Release --no-build --output artifacts

      - name: Verify the package contents
        run: |
          unzip -l "$(ls artifacts/Stil.0*.nupkg)" | tee stil.txt
          grep -q 'staticwebassets/stil.css' stil.txt
          grep -q 'README.md' stil.txt
          unzip -l "$(ls artifacts/Stil.Charts.0*.nupkg)" | tee charts.txt
          grep -q 'staticwebassets/stil-charts.css' charts.txt
          grep -q 'Stil.Charts.xml' charts.txt
          grep -q 'README.md' charts.txt
          unzip -l "$(ls artifacts/Stil.Markdown.0*.nupkg)" | tee markdown.txt
          grep -q 'Stil.Markdown.xml' markdown.txt
          grep -q 'README.md' markdown.txt
          unzip -l "$(ls artifacts/Stil.RichText.0*.nupkg)" | tee richtext.txt
          grep -q 'Stil.RichText.xml' richtext.txt
          grep -q 'README.md' richtext.txt
          unzip -l "$(ls artifacts/Stil.Templates.0*.nupkg)" | tee templates.txt
          grep -q 'content/StilApp/.template.config/template.json' templates.txt
          grep -q 'content/StilApp/.gitignore' templates.txt

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  templates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installs the template package into an isolated template hive and builds an app for
      # each option combination.
      - name: Test dotnet new stil-app
        run: node templates/test-templates.mjs

  accessibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Stil.Visual/package-lock.json

      - name: Install Playwright
        working-directory: tests/Stil.Visual
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The axe checks only. The screenshot baselines are made on Windows (see
      # tests/Stil.Visual/README.md), so the visual tests run locally.
      - name: Run the axe checks on the samples and the demo
        working-directory: tests/Stil.Visual
        run: npx playwright test --grep @a11y

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/Stil.Visual/playwright-report
