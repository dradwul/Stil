name: npm

# Publishes Stil CSS (src/Stil.Css) to npm as stil-css when a version tag is pushed, next to the
# NuGet release (release.yml). It can also be run by hand from main (Actions > npm > Run workflow)
# with the tag to publish, for a version that was tagged before this workflow or before the
# NPM_TOKEN secret existed.
#
# One-time setup (owner), free: an npm account, and either
#   - a granular access token with "Read and write" for packages, stored as the repository
#     secret NPM_TOKEN (Settings > Secrets and variables > Actions), or
#   - once stil-css exists on npm: a trusted publisher for this repository and this workflow
#     file (npmjs.com > stil-css > Settings), after which NPM_TOKEN can be deleted.
# Without either, the job skips the publish with a notice instead of failing, and the CSS stays
# available from the GitHub release and jsDelivr.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    defaults:
      run:
        working-directory: src/Stil.Css

    steps:
      - uses: actions/checkout@v7
        with:
          # A run by hand publishes the given tag; a tag push, its own tag.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: src/Stil.Css/package-lock.json

      # The package version must be the tag's: dist/ carries it in its banner.
      - name: Read the version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" != v* ]]; then
            echo "::error::$TAG is not a version tag such as v1.0.0."
            exit 1
          fi
          version="${TAG#v}"
          package=$(node -p "require('./package.json').version")
          if [[ "$version" != "$package" ]]; then
            echo "::error::The tag is $TAG, but package.json says $package. Set the version in src/Stil.Css/package.json, rebuild dist/ and tag again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease goes to the "next" dist-tag, so npm install stil-css stays on the latest release.
          [[ "$version" == *-* ]] && echo "tag=next" >> "$GITHUB_OUTPUT" || echo "tag=latest" >> "$GITHUB_OUTPUT"

      - name: Check that dist/ matches the sources
        run: |
          npm ci
          npm run check

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "stil-css@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::stil-css $VERSION is already on npm."
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          npm install --global npm@11
          if [[ -z "$NODE_AUTH_TOKEN" ]] && ! npm view stil-css name >/dev/null 2>&1; then
            echo "::notice::stil-css is not published: add the NPM_TOKEN secret (see the top of npm.yml), then run this workflow by hand with the tag."
            exit 0
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
